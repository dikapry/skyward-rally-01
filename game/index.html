<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skyward Rally</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1b26; }
  #game {
    position: fixed; inset: 0; width: 100%; height: 100%; display: block;
    touch-action: none; cursor: crosshair;
  }
  /* Read aloud by screen readers, never painted over the flight view. */
  #status {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip-path: inset(50%); white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Skyward Rally flight game: fly the aircraft through four gates and land on the runway using W and S to pitch, A and D to turn, and Q and E for throttle"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
